<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OKUSACA 2026 Magazine</title>
  <meta name="description" content="OKUSACA 2026 — 39th Odwira/Ohum Festival & 41st Anniversary Online Magazine.">
  <style>
    :root{--green:#071f16;--gold:#c9a24a;--cream:#f5f0e5}
    *{box-sizing:border-box}body{margin:0;background:var(--green);color:var(--cream);font-family:Georgia,'Times New Roman',serif;min-height:100vh}
    .hero{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:48px 24px;background:radial-gradient(circle at 50% 35%,#183b2b 0,#071f16 55%,#030e0a 100%)}
    .frame{max-width:900px;border:1px solid rgba(201,162,74,.55);padding:56px 34px;box-shadow:0 0 70px rgba(0,0,0,.35)}
    .eyebrow{letter-spacing:.28em;color:var(--gold);font-size:.82rem;margin-bottom:20px}.title{font-size:clamp(3.4rem,10vw,7.5rem);letter-spacing:.08em;margin:0;color:var(--gold);font-weight:700}.subtitle{font-size:clamp(1rem,2.2vw,1.45rem);line-height:1.6;margin:22px auto;max-width:700px}.edition{color:var(--gold);font-size:1.05rem;letter-spacing:.14em;margin-top:30px}.enter{display:inline-block;margin-top:38px;padding:14px 28px;border:1px solid var(--gold);color:var(--gold);text-decoration:none;letter-spacing:.16em;text-transform:uppercase;font-family:Arial,sans-serif;font-size:.78rem}.enter:hover{background:var(--gold);color:var(--green)}
  </style>
</head>
<body>
  <main class="hero">
    <section class="frame">
      <div class="eyebrow">OKUSACA</div>
      <h1 class="title">2026</h1>
      <p class="subtitle">39th Odwira / Ohum Festival<br>&amp; 41st Anniversary</p>
      <div class="edition">THE ONLINE MAGAZINE</div>
      <a class="enter" href="#magazine">Enter Magazine</a>
    </section>
  </main>
  <section id="magazine" style="padding:80px 24px;text-align:center;background:#f5f0e5;color:#071f16;min-height:40vh">
    <h2 style="font-size:2rem;color:#8b6b26">Magazine Coming Together</h2>
    <p style="max-width:650px;margin:auto;line-height:1.7">The digital edition is being assembled here. This landing page is the foundation for the full OKUSACA 2026 magazine.</p>
  </section>
</body>
</html>
