<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07130d">
<title>OKUSACA Magazine 2026</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07130d;color:#f3e5c2;font-family:Georgia,"Times New Roman",serif}body{user-select:none;-webkit-user-select:none}.app{height:100dvh;display:flex;flex-direction:column}.top{height:58px;flex:0 0 58px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:#06100c;border-bottom:1px solid #a98232;font-family:Arial,sans-serif;z-index:50}.brand{font-size:13px;letter-spacing:.18em;color:#d9b45b}.counter{font-size:13px;color:#eadfca;letter-spacing:.04em}.stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:14px 18px 10px;background:radial-gradient(ellipse at center,rgba(28,54,39,.32) 0%,rgba(7,19,13,0) 62%),#07130d}.book{position:relative;width:min(94vw,1220px);height:min(78vh,820px);transform-style:preserve-3d;transition:transform .25s ease}.spread{position:absolute;inset:0;display:flex;justify-content:center;align-items:stretch;transform-style:preserve-3d;filter:drop-shadow(0 18px 25px rgba(0,0,0,.38))}.page{height:100%;width:50%;background:#fff;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.42);backface-visibility:hidden;-webkit-backface-visibility:hidden;position:relative}.page img{display:block;width:100%;height:100%;object-fit:contain;background:#fff}.left{border-right:1px solid rgba(0,0,0,.28)}.right{border-left:1px solid rgba(0,0,0,.28)}.single{position:absolute;left:25%;top:0;width:50%;height:100%;box-shadow:0 14px 36px rgba(0,0,0,.48)}.turner{position:absolute;top:0;width:50%;height:100%;z-index:20;transform-style:preserve-3d;perspective:2400px;pointer-events:none}.turner .face{position:absolute;inset:0;overflow:hidden;background:#fff;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 14px 36px rgba(0,0,0,.42)}.turner .face img{width:100%;height:100%;object-fit:contain;display:block}.turner .front{transform:rotateY(0)}.turner .back{transform:rotateY(180deg)}.turner.forward-right{left:50%;transform-origin:left center;animation:flipRight .95s cubic-bezier(.2,.72,.25,1) forwards}.turner.back-right{left:0;transform-origin:right center;animation:flipLeftBack .95s cubic-bezier(.2,.72,.25,1) forwards}.turner.forward-cover{left:25%;width:50%;transform-origin:left center;animation:coverOpen 1s cubic-bezier(.18,.7,.2,1) forwards}.turner.back-cover{left:25%;width:50%;transform-origin:left center;animation:coverClose 1s cubic-bezier(.18,.7,.2,1) forwards}@keyframes flipRight{0%{transform:rotateY(0);box-shadow:0 10px 20px rgba(0,0,0,.25)}45%{box-shadow:-25px 18px 45px rgba(0,0,0,.38)}100%{transform:rotateY(-180deg);box-shadow:0 10px 20px rgba(0,0,0,.2)}}@keyframes flipLeftBack{0%{transform:rotateY(0);box-shadow:0 10px 20px rgba(0,0,0,.2)}45%{box-shadow:25px 18px 45px rgba(0,0,0,.38)}100%{transform:rotateY(180deg);box-shadow:0 10px 20px rgba(0,0,0,.2)}}@keyframes coverOpen{0%{transform:rotateY(0)}45%{box-shadow:-25px 18px 48px rgba(0,0,0,.4)}100%{transform:rotateY(-180deg)}}@keyframes coverClose{0%{transform:rotateY(-180deg)}45%{box-shadow:25px 18px 48px rgba(0,0,0,.4)}100%{transform:rotateY(0)}}.spine{position:absolute;left:50%;top:0;width:2px;height:100%;background:linear-gradient(90deg,rgba(0,0,0,.25),rgba(255,255,255,.45),rgba(0,0,0,.25));z-index:25;pointer-events:none}.hint{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font:10px Arial,sans-serif;letter-spacing:.13em;color:#cdbf9e;opacity:.65;pointer-events:none;z-index:40;white-space:nowrap}.zones{position:absolute;inset:0;z-index:35;display:flex;pointer-events:none}.zone{width:50%;height:100%;pointer-events:auto;cursor:pointer}.zone:hover{background:linear-gradient(90deg,rgba(201,162,74,.04),transparent)}.zone.right:hover{background:linear-gradient(270deg,rgba(201,162,74,.04),transparent)}.controls{height:70px;flex:0 0 70px;display:flex;align-items:center;justify-content:center;gap:10px;background:#06100c;border-top:1px solid #725923;z-index:50}button{appearance:none;border:1px solid #a98232;background:#0c1c14;color:#e8d49e;border-radius:4px;padding:11px 16px;font:11px Arial,sans-serif;letter-spacing:.1em;cursor:pointer}button:hover{background:#c9a34d;color:#07130d}button:disabled{opacity:.35;cursor:not-allowed}.thumbs{position:fixed;left:0;top:58px;bottom:70px;width:min(340px,82vw);background:rgba(5,14,10,.98);border-right:1px solid #8d6c2b;z-index:80;transform:translateX(-102%);transition:transform .28s ease;padding:14px;overflow:auto}.thumbs.open{transform:translateX(0)}.thumbgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.thumb{background:#fff;border:1px solid #5d4920;padding:0;cursor:pointer;position:relative}.thumb img{display:block;width:100%;height:auto}.thumb span{position:absolute;bottom:2px;right:3px;background:rgba(0,0,0,.7);color:#fff;font:8px Arial;padding:2px 3px}.thumb.active{border:2px solid #d3ae55}.thumbtitle{font:11px Arial,sans-serif;letter-spacing:.12em;color:#d9b45b;margin:0 0 12px}.loader{position:fixed;inset:0;background:#06100c;z-index:200;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;transition:opacity .35s ease}.loader.hide{opacity:0;pointer-events:none}.loader .mark{font-size:22px;letter-spacing:.24em;color:#d9b45b}.loader .bar{width:220px;height:2px;background:#2a382f;overflow:hidden}.loader .bar i{display:block;height:100%;width:35%;background:#c9a24a;animation:load 1.1s ease-in-out infinite}@keyframes load{0%{transform:translateX(-120%)}100%{transform:translateX(650%)}}@media(max-width:700px){.top{height:48px;flex-basis:48px;padding:0 12px}.brand{font-size:10px}.counter{font-size:10px}.stage{padding:6px 4px 8px}.book{width:96vw;height:84vh}.spread{display:none}.single{left:0;width:100%}.zones{display:flex}.hint{display:none}.controls{height:58px;flex-basis:58px;gap:5px}.controls button{padding:9px 8px;font-size:9px}.thumbs{top:48px;bottom:58px;width:92vw}.thumbgrid{grid-template-columns:repeat(5,1fr)}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}.turner{animation-duration:.01ms!important}.thumbs{transition:none}.loader .bar i{animation:none}}
</style>
</head>
<body>
<div class="loader" id="loader"><div class="mark">OKUSACA</div><div class="bar"><i></i></div><div style="font:10px Arial,sans-serif;letter-spacing:.12em;color:#bcae91">LOADING MAGAZINE</div></div>
<div class="app">
<header class="top"><div class="brand">OKUSACA MAGAZINE 2026</div><div class="counter" id="counter">PAGE 1 / 72</div></header>
<main class="stage" id="stage"><div class="book" id="book"></div><div class="hint">CLICK LEFT OR RIGHT TO TURN</div></main>
<nav class="controls"><button id="thumbBtn">THUMBNAILS</button><button id="first">FIRST</button><button id="prev">PREVIOUS</button><button id="next">NEXT</button><button id="last">LAST</button><button id="fs">FULL SCREEN</button></nav>
</div>
<aside class="thumbs" id="thumbs"><div class="thumbtitle">OKUSACA 2026 · PAGES</div><div class="thumbgrid" id="thumbgrid"></div></aside>
<script>
const TOTAL=72,img=n=>`pages/page-${String(n).padStart(3,'0')}.jpg`;let pos=1,busy=false;const book=document.getElementById('book'),stage=document.getElementById('stage'),counter=document.getElementById('counter'),thumbs=document.getElementById('thumbs'),grid=document.getElementById('thumbgrid');const btn={first:document.getElementById('first'),prev:document.getElementById('prev'),next:document.getElementById('next'),last:document.getElementById('last')};
function picture(n){const i=document.createElement('img');i.src=img(n);i.alt=`OKUSACA 2026 magazine page ${n}`;i.draggable=false;return i}function page(n,cls='page'){const p=document.createElement('div');p.className=cls;p.appendChild(picture(n));return p}function start(n){return n%2===0?n:n-1}
function render(){book.innerHTML='';if(pos===1||pos===TOTAL){book.appendChild(page(pos,'page single'));}else{const s=document.createElement('div');s.className='spread';const a=start(pos);s.append(page(a,'page left'),page(a+1,'page right'));book.appendChild(s);const spine=document.createElement('div');spine.className='spine';book.appendChild(spine);const zones=document.createElement('div');zones.className='zones';const l=document.createElement('div'),r=document.createElement('div');l.className='zone';r.className='zone right';l.onclick=()=>turn('prev');r.onclick=()=>turn('next');zones.append(l,r);book.appendChild(zones)}if(pos===1||pos===TOTAL){const zones=document.createElement('div');zones.className='zones';const l=document.createElement('div'),r=document.createElement('div');l.className='zone';r.className='zone right';l.onclick=()=>turn('prev');r.onclick=()=>turn('next');zones.append(l,r);book.appendChild(zones)}counter.textContent=`PAGE ${pos} / ${TOTAL}`;btn.first.disabled=btn.prev.disabled=pos===1;btn.next.disabled=btn.last.disabled=pos===TOTAL;document.querySelectorAll('.thumb').forEach(x=>x.classList.toggle('active',Number(x.dataset.page)===pos))}
function nextPos(){if(pos===1)return 2;if(pos===70)return 72;return pos+2}function prevPos(){if(pos===72)return 70;if(pos===2)return 1;return pos-2}
function turn(dir){if(busy)return;const old=pos,target=dir==='next'?nextPos():prevPos();if(old===target)return;busy=true;
if(old===1&&target===2){book.innerHTML='';const s=document.createElement('div');s.className='spread';s.append(page(2,'page left'),page(3,'page right'));book.appendChild(s);const t=document.createElement('div');t.className='turner forward-cover';const f=document.createElement('div');f.className='face front';f.appendChild(picture(1));const b=document.createElement('div');b.className='face back';b.appendChild(picture(2));t.append(f,b);book.appendChild(t);finish(t,target);return}
if(old===70&&target===72){book.innerHTML='';book.appendChild(page(72,'page single'));const t=document.createElement('div');t.className='turner forward-cover';const f=document.createElement('div');f.className='face front';f.appendChild(picture(71));const b=document.createElement('div');b.className='face back';b.appendChild(picture(72));t.append(f,b);book.appendChild(t);finish(t,target);return}
if(old===72&&target===70){book.innerHTML='';const s=document.createElement('div');s.className='spread';s.append(page(70,'page left'),page(71,'page right'));book.appendChild(s);const t=document.createElement('div');t.className='turner back-cover';const f=document.createElement('div');f.className='face front';f.appendChild(picture(72));const b=document.createElement('div');b.className='face back';b.appendChild(picture(71));t.append(f,b);book.appendChild(t);finish(t,target);return}
const a=start(old),n=start(target);const s=document.createElement('div');s.className='spread';s.append(page(n,'page left'),page(n+1,'page right'));book.appendChild(s);const t=document.createElement('div');t.className=`turner ${dir==='next'?'forward-right':'back-right'}`;const f=document.createElement('div');f.className='face front';const b=document.createElement('div');b.className='face back';if(dir==='next'){f.appendChild(picture(a+1));b.appendChild(picture(n))}else{f.appendChild(picture(a));b.appendChild(picture(n+1))}t.append(f,b);book.appendChild(t);finish(t,target)}
function finish(t,target){t.addEventListener('animationend',()=>{pos=target;busy=false;render()},{once:true})}
function jump(n){if(busy)return;pos=n;render();thumbs.classList.remove('open')}
btn.first.onclick=()=>{if(!busy){pos=1;render()}};btn.last.onclick=()=>{if(!busy){pos=72;render()}};btn.next.onclick=()=>turn('next');btn.prev.onclick=()=>turn('prev');document.getElementById('thumbBtn').onclick=()=>thumbs.classList.toggle('open');document.getElementById('fs').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();turn('next')}else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();turn('prev')}else if(e.key==='Home'&&!busy){pos=1;render()}else if(e.key==='End'&&!busy){pos=72;render()}else if(e.key==='Escape')thumbs.classList.remove('open')});let sx=0;stage.addEventListener('touchstart',e=>sx=e.changedTouches[0].clientX,{passive:true});stage.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>45)turn(dx<0?'next':'prev')},{passive:true});
for(let n=1;n<=TOTAL;n++){const t=document.createElement('button');t.type='button';t.className='thumb';t.dataset.page=n;t.title=`Page ${n}`;t.innerHTML=`<img src="${img(n)}" loading="lazy" alt="Page ${n}"><span>${n}</span>`;t.onclick=()=>jump(n);grid.appendChild(t)}
render();window.addEventListener('load',()=>setTimeout(()=>document.getElementById('loader').classList.add('hide'),250));
</script>
</body></html>
