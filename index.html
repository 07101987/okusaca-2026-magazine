<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07140e">
<title>OKUSACA Magazine 2026</title>
<style>
:root{--bg:#07140e;--panel:#06100c;--gold:#c9a24a;--paper:#fff;--ink:#f4ead1}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif}
body{user-select:none;-webkit-user-select:none}.app{height:100dvh;display:flex;flex-direction:column}
.top{height:54px;flex:0 0 54px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:#050d09;border-bottom:1px solid #80652e;z-index:50}.brand{font-size:14px;letter-spacing:.18em;color:#d8b65d}.counter{font-size:12px;letter-spacing:.08em;color:#e9dfca}
.stage{position:relative;flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:18px;perspective:2400px}.book{position:relative;height:min(82vh,760px);width:min(calc((82vh * 340 / 252)),92vw);max-height:calc(100dvh - 128px);aspect-ratio:340/252;transform-style:preserve-3d}
.spread{position:absolute;inset:0;display:flex;justify-content:center;align-items:stretch;transform-style:preserve-3d}.page{height:100%;width:50%;background:#fff;overflow:hidden;box-shadow:0 14px 36px rgba(0,0,0,.48);backface-visibility:hidden;-webkit-backface-visibility:hidden}.page img{display:block;width:100%;height:100%;object-fit:contain;background:#fff}.left{border-right:1px solid rgba(0,0,0,.22)}.right{border-left:1px solid rgba(0,0,0,.22)}
.single{position:absolute;left:25%;top:0;width:50%;height:100%;box-shadow:0 14px 36px rgba(0,0,0,.48)}
.turner{position:absolute;top:0;width:50%;height:100%;z-index:20;transform-style:preserve-3d;perspective:2400px;pointer-events:none}.turner.right{left:50%;transform-origin:left center}.turner.left{left:0;transform-origin:right center}.turner .face{position:absolute;inset:0;overflow:hidden;background:#fff;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 14px 36px rgba(0,0,0,.42)}.turner .face img{width:100%;height:100%;object-fit:contain;display:block}.turner .front{transform:rotateY(0)}.turner .back{transform:rotateY(180deg)}
.turner.forward-right{animation:flipRight .9s cubic-bezier(.2,.72,.25,1) forwards}.turner.back-right{animation:flipRightBack .9s cubic-bezier(.2,.72,.25,1) forwards}.turner.forward-cover{left:25%;width:50%;transform-origin:left center;animation:coverOpen .95s cubic-bezier(.18,.7,.2,1) forwards}.turner.back-cover{left:25%;width:50%;transform-origin:left center;animation:coverClose .95s cubic-bezier(.18,.7,.2,1) forwards}
@keyframes flipRight{from{transform:rotateY(0)}to{transform:rotateY(-180deg)}}@keyframes flipRightBack{from{transform:rotateY(-180deg)}to{transform:rotateY(0)}}@keyframes coverOpen{from{transform:rotateY(0)}to{transform:rotateY(-180deg)}}@keyframes coverClose{from{transform:rotateY(-180deg)}to{transform:rotateY(0)}}
.shade{position:absolute;inset:0;pointer-events:none;z-index:30;background:linear-gradient(90deg,transparent 45%,rgba(0,0,0,.16) 50%,transparent 55%);opacity:.35}
.hint{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:.12em;color:#cfc3a9;opacity:.7;z-index:40;white-space:nowrap}.controls{height:62px;flex:0 0 62px;display:flex;align-items:center;justify-content:center;gap:8px;background:#050d09;border-top:1px solid #80652e;z-index:50}button{border:1px solid #8f702e;background:#0c1b13;color:#e8d49c;border-radius:4px;padding:9px 14px;font:11px Arial,sans-serif;letter-spacing:.09em;cursor:pointer}button:hover{background:#c9a24a;color:#07140e}button:disabled{opacity:.35;cursor:not-allowed}
@media(max-width:760px){.top{height:48px;flex-basis:48px;padding:0 10px}.brand{font-size:11px}.counter{font-size:10px}.stage{padding:6px}.book{height:min(82vh,760px);width:min(calc(82vh * 170 / 252),94vw);aspect-ratio:170/252}.spread{display:none}.single{left:0;width:100%}.mobile-page{display:block!important}.hint{display:none}.controls{height:58px;flex-basis:58px;gap:4px}.controls button{padding:8px 8px;font-size:9px}.shade{display:none}}
@media(prefers-reduced-motion:reduce){.turner{animation-duration:.01ms!important}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand">OKUSACA MAGAZINE 2026</div><div class="counter" id="counter">PAGE 1 / 72</div></header>
<main class="stage" id="stage"><div class="book" id="book"></div><div class="hint">CLICK THE PAGE OR USE NEXT / PREVIOUS</div></main>
<nav class="controls"><button id="first">FIRST</button><button id="prev">PREVIOUS</button><button id="next">NEXT</button><button id="last">LAST</button><button id="fs">FULL SCREEN</button></nav>
</div>
<script>
const TOTAL=72, img=n=>`pages/page-${String(n).padStart(3,'0')}.jpg`;
let pos=1,busy=false;
const book=document.getElementById('book'),stage=document.getElementById('stage'),counter=document.getElementById('counter');
const btn={first:document.getElementById('first'),prev:document.getElementById('prev'),next:document.getElementById('next'),last:document.getElementById('last')};
const el=(tag,cls)=>{const x=document.createElement(tag);x.className=cls;return x};
function picture(n){const i=document.createElement('img');i.src=img(n);i.alt=`OKUSACA 2026 magazine page ${n}`;i.draggable=false;return i}
function page(n,cls='page'){const p=el('div',cls);p.appendChild(picture(n));return p}
function interiorStart(n){return n%2===0?n:n-1}
function render(){
 book.innerHTML='';
 if(pos===1||pos===TOTAL){book.appendChild(page(pos,'page single'));}
 else{const s=el('div','spread');const start=interiorStart(pos);s.appendChild(page(start,'page left'));s.appendChild(page(start+1,'page right'));book.appendChild(s)}
 counter.textContent=`PAGE ${pos} / ${TOTAL}`;
 btn.first.disabled=btn.prev.disabled=pos===1;btn.next.disabled=btn.last.disabled=pos===TOTAL;
}
function nextPos(){if(pos===1)return 2;if(pos===70)return 72;return pos+2}
function prevPos(){if(pos===72)return 70;if(pos===2)return 1;return pos-2}
function makeTurn(dir,old,target){
 if(busy||old===target)return;busy=true;
 if((old===1&&target===2)||(old===72&&target===70)){
   const t=el('div',`turner ${old===1?'forward-cover':'back-cover'}`);const f=el('div','face front');f.appendChild(picture(old));const b=el('div','face back');b.appendChild(picture(old===1?2:71));t.append(f,b);book.appendChild(page(old===1?2:70,'spread'));book.appendChild(t);
   t.addEventListener('animationend',()=>{pos=target;busy=false;render()},{once:true});return;
 }
 if(old===70&&target===72){
   const s=page(72,'page single');book.appendChild(s);const t=el('div','turner forward-cover');t.appendChild(page(71,'face front'));const b=el('div','face back');b.appendChild(picture(72));t.appendChild(b);book.appendChild(t);t.addEventListener('animationend',()=>{pos=72;busy=false;render()},{once:true});return;
 }
 const start=interiorStart(old),next=interiorStart(target);book.appendChild((()=>{const s=el('div','spread');s.appendChild(page(next,'page left'));s.appendChild(page(next+1,'page right'));return s})());
 const t=el('div',`turner ${dir==='next'?'forward-right':'back-right'}`);
 if(dir==='next'){const f=el('div','face front');f.appendChild(picture(start+1));const b=el('div','face back');b.appendChild(picture(next));t.append(f,b)}
 else{const f=el('div','face front');f.appendChild(picture(start));const b=el('div','face back');b.appendChild(picture(start+1));t.className='turner back-right';t.append(f,b)}
 book.appendChild(t);t.addEventListener('animationend',()=>{pos=target;busy=false;render()},{once:true});
}
function go(dir){if(busy)return;const target=dir==='next'?nextPos():prevPos();makeTurn(dir,pos,target)}
btn.first.onclick=()=>{if(!busy){pos=1;render()}};btn.last.onclick=()=>{if(!busy){pos=72;render()}};btn.next.onclick=()=>go('next');btn.prev.onclick=()=>go('prev');
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown')go('next');if(e.key==='ArrowLeft'||e.key==='PageUp')go('prev');if(e.key==='Home'&&!busy){pos=1;render()}if(e.key==='End'&&!busy){pos=72;render()}});
let sx=0;stage.addEventListener('touchstart',e=>sx=e.changedTouches[0].clientX,{passive:true});stage.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>45)go(dx<0?'next':'prev')},{passive:true});
book.addEventListener('click',e=>{if(busy)return;const r=book.getBoundingClientRect();go(e.clientX>r.left+r.width/2?'next':'prev')});
document.getElementById('fs').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();
render();
</script>
</body>
</html>
