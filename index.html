<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OKUSACA 2026 — Online Magazine</title>
<meta name="description" content="OKUSACA 2026 — 39th Odwira / Ohum Festival and 41st Anniversary Online Magazine.">
<style>
:root{--green:#06180f;--green2:#0b281c;--gold:#c7a04a;--paper:#f7f3e9;--ink:#1d1a15;--muted:#cfc6b2}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 42%,#163b2a 0,#06180f 65%,#020a06 100%);color:var(--paper);font-family:Georgia,'Times New Roman',serif}
body{display:flex;flex-direction:column}header{height:54px;flex:0 0 54px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #765c29;background:rgba(3,12,8,.94);font-family:Arial,sans-serif}.brand{font-weight:700;letter-spacing:.13em;font-size:13px}.edition{color:var(--muted);font-size:10px;letter-spacing:.08em;margin-top:3px}.tools{display:flex;gap:6px}button{min-width:44px;min-height:38px;padding:7px 10px;border:1px solid #80662f;background:#0b2419;color:var(--paper);font:600 10px Arial,sans-serif;letter-spacing:.05em;cursor:pointer;border-radius:2px}button:hover{background:#173d2b}button:disabled{opacity:.4;cursor:not-allowed}
main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:12px}.book-wrap{width:min(1500px,96vw);height:min(760px,calc(100vh - 96px));display:flex;align-items:center;justify-content:center;perspective:2200px}.book{position:relative;width:min(1200px,92vw);height:min(700px,calc(100vh - 120px));transform-style:preserve-3d;filter:drop-shadow(0 22px 30px rgba(0,0,0,.45))}.spread{position:absolute;inset:0;display:flex;justify-content:center;align-items:stretch}.page{height:100%;width:50%;object-fit:contain;background:#fff;box-shadow:0 0 0 1px rgba(70,50,20,.2);backface-visibility:hidden}.left{border-right:1px solid #9f9272}.right{border-left:1px solid #9f9272}.single .page{width:auto;max-width:72%;margin:auto}.turn{position:absolute;top:0;height:100%;width:50%;transform-style:preserve-3d;z-index:20;display:none}.turn .front,.turn .back{position:absolute;inset:0;background:#fff;backface-visibility:hidden;overflow:hidden;box-shadow:0 0 18px rgba(0,0,0,.22)}.turn img{width:100%;height:100%;object-fit:cover;display:block}.turn .back{transform:rotateY(180deg)}.turn.next{right:0;transform-origin:left center}.turn.prev{left:0;transform-origin:right center}.turning-next{animation:turnNext .85s cubic-bezier(.25,.7,.2,1) forwards}.turning-prev{animation:turnPrev .85s cubic-bezier(.25,.7,.2,1) forwards}@keyframes turnNext{from{transform:rotateY(0)}to{transform:rotateY(-180deg)}}@keyframes turnPrev{from{transform:rotateY(0)}to{transform:rotateY(180deg)}}
.book::before,.book::after{content:"";position:absolute;top:2%;bottom:2%;width:5px;background:rgba(0,0,0,.25);z-index:-1}.book::before{left:50%;transform:translateX(-50%)}.book::after{display:none}.hint{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);font:10px Arial,sans-serif;color:var(--muted);letter-spacing:.08em;pointer-events:none}.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(4,16,10,.88);z-index:50;font:12px Arial,sans-serif;letter-spacing:.12em;color:var(--gold)}footer{height:34px;flex:0 0 34px;display:flex;align-items:center;justify-content:center;font:10px Arial,sans-serif;color:var(--muted);letter-spacing:.06em}
@media(max-width:800px){header{height:50px;flex-basis:50px;padding:0 9px}.edition{display:none}.brand{font-size:11px}.tools button{font-size:9px;padding:6px 7px}.tools button:nth-child(1),.tools button:nth-child(4){display:none}main{padding:6px}.book-wrap{width:100%;height:calc(100vh - 90px)}.book{width:100%;height:calc(100vh - 105px)}.spread .left{display:none}.spread .right{width:100%;border:0}.turn{width:100%}.hint{bottom:5px}footer{height:30px;flex-basis:30px}}
@media(prefers-reduced-motion:reduce){.turning-next,.turning-prev{animation:none}.turn{transition:none}}
</style>
</head>
<body>
<header><div><div class="brand">OKUSACA 2026</div><div class="edition">39TH ODWIRA / OHUM FESTIVAL · 41ST ANNIVERSARY</div></div><div class="tools"><button id="first">FIRST</button><button id="prev">PREVIOUS</button><button id="next">NEXT</button><button id="last">LAST</button></div></header>
<main><div class="book-wrap"><div class="book" id="book"><div class="spread" id="spread"><img class="page left" id="left" alt=""><img class="page right" id="right" alt=""></div><div class="turn next" id="turnNext"><div class="front"><img id="nextFront" alt=""></div><div class="back"><img id="nextBack" alt=""></div></div><div class="turn prev" id="turnPrev"><div class="front"><img id="prevFront" alt=""></div><div class="back"><img id="prevBack" alt=""></div></div><div class="loading" id="loading">LOADING MAGAZINE…</div><div class="hint">SWIPE · ARROW KEYS · PREVIOUS / NEXT</div></div></div></main>
<footer><span id="count">Preparing OKUSACA 2026…</span></footer>
<script>
(()=>{
const TOTAL=72,book=document.getElementById('book'),spread=document.getElementById('spread'),left=document.getElementById('left'),right=document.getElementById('right'),tn=document.getElementById('turnNext'),tp=document.getElementById('turnPrev'),loading=document.getElementById('loading'),count=document.getElementById('count');
let state=1,busy=false; const src=n=>'pages/page-'+String(n).padStart(3,'0')+'.jpg';
function setImg(el,n){el.src=src(n);el.alt='OKUSACA 2026 magazine page '+n}
function render(){
  loading.style.display='none'; tn.style.display='none';tp.style.display='none'; tn.className='turn next';tp.className='turn prev';
  if(state===1||state===TOTAL){spread.className='spread single';left.style.display='none';right.style.display='block';setImg(right,state);count.textContent='Page '+state+' of '+TOTAL}
  else{spread.className='spread';left.style.display='block';right.style.display='block';setImg(left,state);setImg(right,state+1);count.textContent='Pages '+state+'–'+(state+1)+' of '+TOTAL}
}
function target(dir){if(busy)return;let to;if(dir>0){if(state===1)to=2;else if(state<TOTAL-1)to=state+2;else if(state===TOTAL-1)to=TOTAL;else return}else{if(state===TOTAL)to=TOTAL-2;else if(state>2)to=state-2;else if(state===2)to=1;else return} animate(to,dir)}
function animate(to,dir){busy=true;const el=dir>0?tn:tp, f=dir>0?document.getElementById('nextFront'):document.getElementById('prevFront'), b=dir>0?document.getElementById('nextBack'):document.getElementById('prevBack');
  if(dir>0){if(state===1){setImg(f,2);setImg(b,1)}else if(to===TOTAL){setImg(f,TOTAL);setImg(b,state+1)}else{setImg(f,to+1);setImg(b,state+1)}}else{if(state===TOTAL){setImg(f,TOTAL-1);setImg(b,TOTAL)}else if(to===1){setImg(f,1);setImg(b,state)}else{setImg(f,to);setImg(b,state)}}
  el.style.display='block'; void el.offsetWidth; el.classList.add(dir>0?'turning-next':'turning-prev');
  const done=()=>{el.classList.remove('turning-next','turning-prev');render();busy=false;el.removeEventListener('animationend',done)}; el.addEventListener('animationend',done); setTimeout(()=>{if(busy)done()},900)
}
function first(){if(state!==1)animate(1,-1)} function last(){if(state!==TOTAL)animate(TOTAL,1)}
document.getElementById('next').onclick=()=>target(1);document.getElementById('prev').onclick=()=>target(-1);document.getElementById('first').onclick=first;document.getElementById('last').onclick=last;
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight'||e.key==='PageDown')target(1);if(e.key==='ArrowLeft'||e.key==='PageUp')target(-1);if(e.key==='Home')first();if(e.key==='End')last()});
let x=0;book.addEventListener('touchstart',e=>{x=e.changedTouches[0].clientX},{passive:true});book.addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-x;if(Math.abs(d)>45)target(d<0?1:-1)},{passive:true});
['left','right','nextFront','nextBack','prevFront','prevBack'].forEach(id=>document.getElementById(id).addEventListener('error',()=>{}));
// Preload the first reading set, then reveal the viewer. Missing page assets remain a clear broken-image fallback rather than a fake page.
const firstImgs=[1,2,3,4];let loaded=0;firstImgs.forEach(n=>{const im=new Image();im.onload=()=>{loaded++;if(loaded===firstImgs.length)render()};im.onerror=()=>{loaded++;if(loaded===firstImgs.length)render()};im.src=src(n)});
})();
</script>
</body>
</html>
