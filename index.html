<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071f16"><title>OKUSACA Magazine 2026</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07110d;color:#f5ead0;font-family:Georgia,"Times New Roman",serif}body{user-select:none;-webkit-user-select:none}.app{height:100dvh;display:flex;flex-direction:column}.top{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:rgba(4,13,9,.96);border-bottom:1px solid #a8873b;z-index:20;font-family:Arial,sans-serif}.brand{font-size:12px;letter-spacing:.18em;color:#d9b75e}.counter{font-size:12px;color:#e7dcc5}.stage{position:relative;flex:1;display:flex;align-items:center;justify-content:center;perspective:2200px;overflow:hidden;padding:20px}.book{position:relative;width:min(92vw,1100px);height:min(86vh,780px);transform-style:preserve-3d}.page{position:relative;height:100%;background:#fff;overflow:hidden;box-shadow:0 12px 35px rgba(0,0,0,.45);backface-visibility:hidden;-webkit-backface-visibility:hidden}.page img{display:block;width:100%;height:100%;object-fit:contain;background:#fff}.single{width:min(48%,520px);aspect-ratio:170/252;height:auto;max-height:100%;margin:auto}.dual{width:50%;aspect-ratio:170/252;height:100%}.left{transform-origin:right center;border-right:1px solid rgba(0,0,0,.18)}.right{transform-origin:left center;border-left:1px solid rgba(0,0,0,.18)}.flip{position:absolute;inset:0;z-index:10;display:flex;transform-style:preserve-3d}.flip .page{position:absolute;top:0;width:50%;height:100%}.flip .left{right:50%}.flip .right{left:50%}.flipping-forward .left{animation:turnLeft .85s cubic-bezier(.22,.61,.36,1) forwards}.flipping-forward .right{animation:turnRight .85s cubic-bezier(.22,.61,.36,1) forwards}.flipping-back .left{animation:turnLeftBack .85s cubic-bezier(.22,.61,.36,1) forwards}.flipping-back .right{animation:turnRightBack .85s cubic-bezier(.22,.61,.36,1) forwards}@keyframes turnLeft{from{transform:rotateY(0)}to{transform:rotateY(-180deg)}}@keyframes turnRight{from{transform:rotateY(0)}to{transform:rotateY(180deg)}}@keyframes turnLeftBack{from{transform:rotateY(-180deg)}to{transform:rotateY(0)}}@keyframes turnRightBack{from{transform:rotateY(180deg)}to{transform:rotateY(0)}}.hint{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);font:11px Arial,sans-serif;letter-spacing:.08em;color:#c8bea8;opacity:.75;z-index:15}.controls{height:68px;display:flex;align-items:center;justify-content:center;gap:9px;background:rgba(4,13,9,.96);border-top:1px solid #765d25;z-index:20}button{border:1px solid #a8873b;background:#101e17;color:#e7d39b;border-radius:4px;padding:10px 13px;font:11px Arial,sans-serif;letter-spacing:.08em;cursor:pointer}button:hover{background:#c9a24a;color:#071f16}button:disabled{opacity:.35;cursor:not-allowed}#fullscreen{margin-left:12px}@media(max-width:700px){.top{height:48px}.stage{padding:8px}.book{width:94vw;height:84vh}.single{width:min(94%,520px)}.controls{height:58px;gap:5px}.controls button{padding:9px 8px;font-size:10px}.hint{display:none}}@media(prefers-reduced-motion:reduce){.flipping-forward .left,.flipping-forward .right,.flipping-back .left,.flipping-back .right{animation-duration:.01ms}}</style></head><body><div class="app"><header class="top"><div class="brand">OKUSACA MAGAZINE 2026</div><div class="counter" id="counter">PAGE 1 / 72</div></header><main class="stage" id="stage"><div class="book" id="book"></div><div class="hint">CLICK LEFT OR RIGHT TO TURN</div></main><nav class="controls"><button id="first">FIRST</button><button id="prev">PREVIOUS</button><button id="next">NEXT</button><button id="last">LAST</button><button id="fullscreen">FULL SCREEN</button></nav></div><script>const TOTAL=72,path=n=>`pages/page-${String(n).padStart(3,"0")}.jpg`;let pos=1,busy=false;const book=document.getElementById("book"),counter=document.getElementById("counter"),B={first:document.getElementById("first"),prev:document.getElementById("prev"),next:document.getElementById("next"),last:document.getElementById("last")};const image=n=>`<img src="${path(n)}" alt="OKUSACA 2026 magazine page ${n}" draggable="false">`;function render(){book.innerHTML="";if(pos===1||pos===TOTAL){let p=document.createElement("div");p.className="page single";p.innerHTML=image(pos);book.appendChild(p)}else{let l=document.createElement("div"),r=document.createElement("div");l.className="page dual left";r.className="page dual right";l.innerHTML=image(pos%2===0?pos:pos-1);r.innerHTML=image(pos%2===0?pos+1:pos);book.append(l,r)}counter.textContent=`PAGE ${pos} / ${TOTAL}`;B.first.disabled=B.prev.disabled=pos===1;B.next.disabled=B.last.disabled=pos===TOTAL}function nextTarget(){if(pos===1)return 2;if(pos%2===0)return Math.min(TOTAL,pos+2);return Math.min(TOTAL,pos+1)}function prevTarget(){if(pos===TOTAL)return 71;if(pos%2===1)return Math.max(1,pos-2);return Math.max(1,pos-1)}function turn(dir){if(busy)return;let target=dir==="next"?nextTarget():prevTarget();if(target===pos)return;if(pos===1||pos===TOTAL){pos=target;render();return}busy=true;let old=pos,flip=document.createElement("div");flip.className="flip "+(dir==="next"?"flipping-forward":"flipping-back");let l=document.createElement("div"),r=document.createElement("div");l.className="page dual left";r.className="page dual right";if(dir==="next"){l.innerHTML=image(old);r.innerHTML=image(old+1)}else{l.innerHTML=image(old-1);r.innerHTML=image(old)}flip.append(l,r);book.appendChild(flip);pos=target;render();flip.addEventListener("animationend",()=>{flip.remove();busy=false},{once:true})}function jump(n){if(busy)return;pos=Math.max(1,Math.min(TOTAL,n));render()}B.first.onclick=()=>jump(1);B.last.onclick=()=>jump(TOTAL);B.next.onclick=()=>turn("next");B.prev.onclick=()=>turn("prev");document.addEventListener("keydown",e=>{if(e.key==="ArrowRight"||e.key==="PageDown")turn("next");else if(e.key==="ArrowLeft"||e.key==="PageUp")turn("prev");else if(e.key==="Home")jump(1);else if(e.key==="End")jump(TOTAL)});let sx=0;document.getElementById("stage").addEventListener("touchstart",e=>sx=e.changedTouches[0].clientX,{passive:true});document.getElementById("stage").addEventListener("touchend",e=>{let dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>45)turn(dx<0?"next":"prev")},{passive:true});book.addEventListener("click",e=>{let rect=book.getBoundingClientRect();turn(e.clientX<rect.left+rect.width/2?"prev":"next")});document.getElementById("fullscreen").onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();render();</script></body></html>
